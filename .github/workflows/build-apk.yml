name: Build MobilModem Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.4'

    - name: Build APK with Gradle
      working-directory: ./android
      run: |
        gradle assembleDebug --no-daemon --stacktrace

    - name: Copy Built APK
      run: |
        mkdir -p release_output
        find android/app/build/outputs/apk/ -name "*.apk" -exec cp {} release_output/MobilModem.apk \;

    - name: Upload APK to Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: MobilModem-Android-APK
        path: release_output/MobilModem.apk
        retention-days: 30

    - name: Publish to GitHub Releases
      uses: softprops/action-gh-release@v2
      with:
        tag_name: latest-apk
        name: "MobilModem Android APK (En Son Sürüm)"
        body: |
          ### 📱 MobilModem Android Uygulaması
          Aşağıdaki doğrudan bağlantıya tıklayarak telefonunuza hemen indirebilirsiniz:
          - **Tethering / Hotspot Kota Koruması:** %100 Bypass
          - **Çift Mod:** USB Ultra Hız + Wi-Fi Direct P2P
        files: release_output/MobilModem.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
